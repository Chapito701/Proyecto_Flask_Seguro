{% extends 'base.html' %}

{% block title %}Perfil de Usuario{% endblock %}

{% block content %}
<div class="card shadow-sm p-4 col-md-6 mx-auto">
    <h3>Perfil de {{ user.username|capitalize }}</h3>
    <hr>
    <p><strong>ID:</strong> {{ user.id }}</p>
    <p><strong>Usuario:</strong> {{ user.username }}</p>
    <p><strong>Correo:</strong> {{ user.email }}</p>
    
    {% if session.get('user_id') == user.id %}
        <div class="d-flex gap-2 mt-3">
            <a href="{{ url_for('user.edit_profile', id=user.id) }}" class="btn btn-warning">Editar Perfil</a>
            <form action="{{ url_for('user.delete_user', id=user.id) }}" method="POST" onsubmit="return confirm('¿Seguro que deseas eliminar tu cuenta?');">
                <button type="submit" class="btn btn-danger">Eliminar Cuenta</button>
            </form>
        </div>
    {% endif %}
</div>
{% endblock %}
