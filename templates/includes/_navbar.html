<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('user.index') }}">Sistema Usuarios</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('user.index') }}">Inicio</a></li>
        
        <!-- Verificación con Flask-Login -->
        {% if current_user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('user.profile', id=current_user.id) }}">Mi Perfil ({{ current_user.username|capitalize }})</a></li>
          <li class="nav-item"><a class="nav-link btn btn-outline-danger btn-sm text-white ms-2" href="{{ url_for('user.logout') }}">Cerrar Sesión</a></li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('user.login') }}">Login</a></li>
          <li class="nav-item"><a class="nav-link btn btn-primary btn-sm text-white ms-2" href="{{ url_for('user.register') }}">Registro</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
