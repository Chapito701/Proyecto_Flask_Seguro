{% extends 'base.html' %}

{% block title %}Error 401 - No Autorizado{% endblock %}

{% block content %}
<div class="row justify-content-center text-center mt-5">
    <div class="col-md-6">
        <h1 class="display-1 text-warning">401</h1>
        <h2>Acceso No Autorizado</h2>
        <p class="lead">Por favor, inicia sesión para acceder a esta página.</p>
        <a href="{{ url_for('user.login') }}" class="btn btn-primary mt-3">Ir al Login</a>
    </div>
</div>
{% endblock %}
